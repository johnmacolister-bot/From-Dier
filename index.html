<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Есть одно предложение</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f5f3f0;
      color: #222;
      font-family: Arial, sans-serif;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 500px;

      background: white;
      border-radius: 24px;

      padding: 32px 24px;

      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.08);
    }

    .heart {
      text-align: center;
      font-size: 32px;
      margin-bottom: 12px;
    }

    .from {
      text-align: center;
      color: #888;
      font-size: 14px;
      margin-bottom: 8px;
    }

    h1 {
      text-align: center;
      font-size: 27px;
      margin: 0 0 12px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      line-height: 1.5;
      margin-bottom: 28px;
    }

    label {
      display: block;
      margin: 16px 0 7px;
      font-size: 14px;
      color: #555;
    }

    input,
    select,
    textarea {
      width: 100%;

      border: 1px solid #ddd;
      border-radius: 12px;

      padding: 13px;

      font-size: 16px;
      font-family: inherit;

      background: white;
      color: #222;

      outline: none;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #999;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 24px;
    }

    button {
      flex: 1;

      border: none;
      border-radius: 13px;

      padding: 14px 10px;

      font-size: 15px;
      font-family: inherit;

      cursor: pointer;
    }

    .yes {
      background: #222;
      color: white;
    }

    .no {
      background: #eeeeec;
      color: #333;
    }

    button:active {
      transform: scale(0.98);
    }

    .result {
      margin-top: 22px;

      padding: 18px;

      border-radius: 15px;

      background: #f6f4f1;

      text-align: center;
      line-height: 1.7;

      display: none;
    }

    .bottom {
      margin-top: 20px;

      text-align: center;

      font-size: 12px;
      color: #999;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="heart">♡</div>

    <div class="from">от Диера</div>

    <h1>Есть одно предложение</h1>

    <div class="subtitle">
      Выбери день и время — остальное обсудим 🙂
    </div>


    <label for="date">Дата</label>

    <input
      type="date"
      id="date"
    >


    <label for="time">Время</label>

    <input
      type="time"
      id="time"
    >


    <label for="place">Куда</label>

    <select id="place">

      <option>
        Прогуляться в парке
      </option>

      <option>
        Погулять по городу
      </option>

      <option>
        Предложи своё место
      </option>

    </select>


    <label for="note">
      Если хочешь, можешь что-нибудь написать
    </label>

    <textarea
      id="note"
      placeholder="Например: где встретиться..."
    ></textarea>


    <div class="buttons">

      <button
        class="yes"
        onclick="agree()"
      >
        Договорились ♡
      </button>

      <button
        class="no"
        onclick="decline()"
      >
        Не получится
      </button>

    </div>


    <div
      id="result"
      class="result"
    ></div>


    <div class="bottom">
      Если планы изменятся — ничего страшного, можно договориться иначе.
    </div>

  </div>


  <script>

    function agree() {
  const date = document.getElementById("date").value;
  const time = document.getElementById("time").value;
  const place = document.getElementById("place").value;
  const note = document.getElementById("note").value;

  if (!date || !time) {
    alert("Выбери дату и время");
    return;
  }

  fetch("https://curly-butterfly-4f68.johnmacolister.workers.dev/", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      date: formatDate(date),
      time: time,
      place: place,
      note: note
    })
  });

  const result = document.getElementById("result");

  result.style.display = "block";

  result.innerHTML =
    "Договорились ♡<br>" +
    formatDate(date) +
    " в " +
    time +
    "<br>" +
    place;
    }

    function formatDate(date) {

      const parts =
        date.split("-");

      return (
        parts[2] +
        "." +
        parts[1] +
        "." +
        parts[0]
      );
    }


    function escapeHTML(text) {

      const div =
        document.createElement("div");

      div.textContent = text;

      return div.innerHTML;
    }

  </script>

</body>
</html>
