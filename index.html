<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Есть одно предложение</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #f7f5f2;
  color: #242424;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.card {
  width: 100%;
  max-width: 520px;
  background: white;
  border-radius: 24px;
  padding: 34px 26px;
  box-shadow: 0 15px 45px rgba(0,0,0,.08);
}

.heart {
  text-align: center;
  font-size: 28px;
  margin-bottom: 18px;
}

.from {
  text-align: center;
  font-size: 14px;
  color: #888;
  margin-bottom: 8px;
}

h1 {
  text-align: center;
  font-size: 28px;
  margin: 0 0 12px;
}

.subtitle {
  text-align: center;
  color: #777;
  line-height: 1.5;
  margin-bottom: 28px;
}

label {
  display: block;
  font-size: 14px;
  margin: 16px 0 7px;
  color: #555;
}

input,
select,
textarea {
  width: 100%;
  padding: 13px 14px;
  border: 1px solid #ddd;
  border-radius: 12px;
  font-size: 15px;
  background: #fff;
  font-family: inherit;
  outline: none;
}

input:focus,
select:focus,
textarea:focus {
  border-color: #999;
}

textarea {
  min-height: 100px;
  resize: vertical;
}

.buttons {
  display: flex;
  gap: 10px;
  margin-top: 24px;
}

button {
  flex: 1;
  border: none;
  border-radius: 13px;
  padding: 14px 12px;
  font-size: 15px;
  cursor: pointer;
  font-family: inherit;
}

.accept {
  background: #242424;
  color: white;
}

.decline {
  background: #f0efed;
  color: #333;
}

.message {
  text-align: center;
  margin-top: 24px;
  padding: 18px;
  border-radius: 14px;
  background: #f7f5f2;
  line-height: 1.6;
}

.hidden {
  display: none;
}

.small {
  text-align: center;
  color: #999;
  font-size: 12px;
  margin-top: 20px;
}
</style>
</head>

<body>

<div class="card">

  <div class="heart">♡</div>

  <div class="from">от Диера</div>

  <h1>Есть одно предложение</h1>

  <div class="subtitle">
    Выбери день и время — остальное обсудим 🙂
  </div>

  <label for="date">Дата</label>
  <input type="date" id="date">

  <label for="time">Время</label>
  <input type="time" id="time">

  <label for="place">Куда</label>
  <select id="place">
    <option value="Прогуляться в парке">Прогуляться в парке</option>
    <option value="Просто погулять по городу">Просто погулять по городу</option>
    <option value="Предложи своё место">Предложи своё место</option>
  </select>

  <label for="note">Если хочешь, можешь что-нибудь написать</label>
  <textarea
    id="note"
    placeholder="Например: где встретиться..."
  ></textarea>

  <div class="buttons">
    <button class="accept" onclick="agree()">
      Договорились ♡
    </button>

    <button class="decline" onclick="decline()">
      Не получится
    </button>
  </div>

  <div id="result" class="message hidden"></div>

  <div class="small">
    Если планы изменятся — ничего страшного, можно договориться иначе.
  </div>

</div>

<script>

// URL твоего Cloudflare Worker
const WORKER_URL =
  "https://orange-snowflake-dec2.johnmacolister.workers.dev/";

async function agree() {

  const date = document.getElementById("date").value;
  const time = document.getElementById("time").value;
  const place = document.getElementById("place").value;
  const note = document.getElementById("note").value;

  if (!date || !time) {
    alert("Выбери дату и время 🙂");
    return;
  }

  const button = document.querySelector(".accept");
  button.disabled = true;
  button.textContent = "Секунду...";

  try {

    const response = await fetch(WORKER_URL, {
      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        date: date,
        time: time,
        place: place,
        note: note
      })
    });

    if (!response.ok) {
      throw new Error("Worker error");
    }

    const result = document.getElementById("result");

    result.classList.remove("hidden");

    result.innerHTML =
      "Договорились ♡<br><br>" +
      "📅 " + date + "<br>" +
      "🕐 " + time + "<br>" +
      "📍 " + place +
      (note ? "<br><br>💬 " + escapeHTML(note) : "");

    button.textContent = "Готово ♡";

  } catch (error) {

    button.disabled = false;
    button.textContent = "Договорились ♡";

    alert(
      "Не удалось отправить подтверждение. " +
      "Попробуй ещё раз."
    );
  }
}

function decline() {

  const result = document.getElementById("result");

  result.classList.remove("hidden");

  result.innerHTML =
    "Понял 🙂<br><br>" +
    "Ничего страшного. Если захочешь — " +
    "можешь предложить другой день.";
}

function escapeHTML(text) {

  const div = document.createElement("div");
  div.textContent = text;
  return div.innerHTML;
}

</script>

</body>
</html>
