<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>От Диера</title>
  <style>
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;padding:22px;
    display:grid;place-items:center;
    background:radial-gradient(circle at top,#fff 0,#f8f3ff 48%,#eee8f8 100%);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    color:#25202d;
  }
  .card{
    width:min(94vw,560px);padding:34px 25px 26px;
    background:rgba(255,255,255,.9);backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.8);border-radius:30px;
    box-shadow:0 25px 80px rgba(55,35,75,.15);
  }
  .top{text-align:center}
  .heart{font-size:38px;margin-bottom:5px}
  .from{font-size:13px;letter-spacing:2px;text-transform:uppercase;color:#8f8898}
  h1{font-family:Georgia,serif;font-size:31px;font-weight:500;margin:10px 0 12px}
  .intro{color:#655d6d;line-height:1.6;margin:0 0 28px;text-align:center}
  label{display:block;font-size:14px;font-weight:700;margin:15px 0 7px}
  input,select,textarea{
    width:100%;padding:14px 15px;border:1px solid #ded7e5;border-radius:16px;
    background:#fff;font:inherit;color:#25202d;outline:none;
  }
  input:focus,select:focus,textarea:focus{border-color:#9b8bab;box-shadow:0 0 0 4px rgba(155,139,171,.15)}
  textarea{min-height:92px;resize:vertical}
  .buttons{display:flex;gap:10px;margin-top:23px}
  button{flex:1;border:0;border-radius:16px;padding:15px;font-size:16px;font-weight:700;cursor:pointer}
  .yes{background:#292333;color:#fff;box-shadow:0 8px 22px rgba(41,35,51,.25)}
  .no{background:#f0edf3;color:#51495a}
  #result{display:none;margin-top:20px;padding:18px;border-radius:19px;background:#f3edf8;color:#33293f;line-height:1.6}
  #result strong{display:block;font-family:Georgia,serif;font-size:21px;margin-bottom:6px}
  .note{text-align:center;color:#9991a1;font-size:12px;margin:18px 4p 0}
  </style>
</head>
<body>
  <main class="card">
    <div class="top">
      <div class="heart">♡</div>
      <div class="from">Приглашение</div>
      <h1>Давай сходим куда-нибудь?</h1>
      <p class="intro">Выбери удобные день и время, а место я могу подстроить или выберем вместе.</p>
    </div>

    <label for="date">Дата</label>
    <input type="date" id="date">

    <label for="time">Время</label>
    <input type="time" id="time">

    <label for="place">Куда пойдём?</label>
    <select id="place">
      <option value="">-- Выбери вариант --</option>
      <option value="Кофейня / Десерты">Кофейня / Десерты</option>
      <option value="Ужин в ресторане">Ужин в ресторане</option>
      <option value="Прогулка">Прогулка</option>
      <option value="Кино">Кино</option>
      <option value="Сюрприз (выберу сам)">Сюрприз (выберу сам)</option>
    </select>

    <label for="note">Что-нибудь хочешь добавить?</label>
    <textarea id="note" placeholder="Напиши здесь, если есть пожелания..."></textarea>

    <div class="buttons">
      <button class="yes" onclick="confirmDate()">Договорились ♡</button>
      <button class="no" onclick="decline()">Не получится</button>
    </div>

    <div id="result"></div>
    <div class="note">Если планы изменятся — всё нормально, просто скажи.</div>
  </main>

  <script>
  function confirmDate(){
    const date=document.getElementById('date').value;
    const time=document.getElementById('time').value;
    const place=document.getElementById('place').value;
    const note=document.getElementById('note').value.trim();

    if(!date||!time||!place){
      alert('Выбери дату, время и место 😉');
      return;
    }

    const d=new Date(date+'T00:00:00');
    const formatted=d.toLocaleDateString('ru-RU',{day:'numeric',month:'long',weekday:'short'});
    const r=document.getElementById('result');

    r.innerHTML='<strong>Договорились ♡</strong><br>'+
      'Дата: '+formatted+'<br>'+
      'Время: '+time+'<br>'+
      'Место: '+escapeHtml(place)+
      (note?'<br>От тебя: '+escapeHtml(note):'');

    r.style.display='block';
    r.scrollIntoView({behavior:'smooth',block:'nearest'});

    // Отправка в Telegram через Cloudflare Worker
    fetch('https://orange-snowflake-dec2.johnmacolister.workers.dev/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        date: formatted,
        time: time,
        place: place,
        note: note
      })
    }).catch(err => console.error(err));
  }

  function decline(){
    const r=document.getElementById('result');
    r.innerHTML='<strong>Понял 🫡</strong>Ничего страшного. Если захочешь — напиши потом.';
    r.style.display='block';
  }

  function escapeHtml(t){
    const d=document.createElement('div');d.textContent=t;return d.innerHTML;
  }
  </script>
</body>
</html>
